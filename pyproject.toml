[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[project]
name = "mssql2mysql"
version = "0.1.3"
description = "Config-driven CLI tool to migrate MSSQL databases to MySQL."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

authors = [
    { name = "Manan Patel" }
]

dependencies = [
    "pyodbc",
    "mysql-connector-python",
    "pyyaml"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

[project.scripts]
mssql2mysql = "mssql2mysql.cli:main"

[project.urls]
Homepage = "https://github.com/Mananpatel08/mssql2mysql"
Repository = "https://github.com/Mananpatel08/mssql2mysql"
Issues = "https://github.com/Mananpatel08/mssql2mysql/issues"
